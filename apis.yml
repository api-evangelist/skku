        url: examples/skku-pure-oai-listmetadataformats-example.xml
      - type: Conformance
        url: conformance/skku-conformance.yml
  - aid: skku:dcollection-repository
    name: SKKU dCollection Thesis Repository (KERIS) — TENANT
    description: >-
      SKKU's electronic theses and dissertations repository, running on dCollection, the national
      academic-information distribution platform operated for Korean universities. The collection and
      its records are SKKU's; the platform, the software and any contract are the vendor's, so this is
      recorded as a tenancy and no specification is saved for it. It is explicitly NOT recorded as a
      harvesting surface: robots.txt is "User-agent: * / Disallow: /", and the conventional OAI-PMH
      paths /oai, /srv/oai, /oai/request and /dcollection/oai all return the site's HTML shell with
      HTTP 200 rather than an OAI-PMH response — a soft-200, not an endpoint.
    humanURL: https://skku.dcollection.net/
    baseURL: https://skku.dcollection.net/
    tags: [ Research Repository, Theses, dCollection, KERIS, Tenant, Korea ]
