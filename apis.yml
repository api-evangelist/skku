apis:
  - aid: skku:identity-federation
    name: SKKU SAML 2.0 Identity Provider (KAFE / eduGAIN metadata)
    description: >-
      Sungkyunkwan University's institutional identity provider, publishing machine-readable SAML 2.0
      metadata through the KAFE (Korea Access Federation) aggregate and interfederated internationally
      through eduGAIN. entityID https://kafe.skku.edu/idp/simplesamlphp on SKKU's own registrable
      domain, shibmd:Scope skku.edu, OrganizationDisplayName "Sungkyunkwan University",
      OrganizationURL https://www.skku.edu/. SingleSignOnService and SingleLogoutService are offered
      over HTTP-Redirect and HTTP-POST at /simplesaml/saml2/idp/, NameIDFormat is transient, and the
      signing and encryption KeyDescriptors carry a self-issued X.509 certificate for CN=kafe.skku.edu,
      O=SKKU, OU=Information Service Affairs Team valid to 2032-09-22. The entity supports the REFEDS
      Research and Scholarship entity category and asserts the REFEDS Sirtfi security incident
      response assurance profile, with a KAFE jurisdiction attribute of KR. This is institution-operated
      by definition and it is the single most consequential machine-readable surface SKKU runs — it is
      also the class of surface a university catalog almost never records.
    humanURL: https://www.skku.edu/eng/CampusLife/ITServices/KingoPortal1_1.do
    baseURL: https://kafe.skku.edu/simplesaml/saml2/idp/SSOService.php
    tags: [ Identity Federation, SAML, eduGAIN, KAFE, Single Sign-On, Shibboleth Metadata ]
    x-operator: institution
    x-operator-evidence: >-
      Metadata is served for an entityID on kafe.skku.edu — SKKU's own registrable domain — and
      self-asserts md:Organization "Sungkyunkwan University" with OrganizationURL https://www.skku.edu/.
      Registered by KAFE (registrationAuthority http://kafe.kreonet.net) on 2022-09-26 and present in
      the eduGAIN aggregate since 2022-11-16. The certificate subject names SKKU's Information Service
      Affairs Team.
    x-developer-usable: false
    x-developer-note: >-
      An end-user login federation, not a developer authorization surface. There is no client
      registration path, no token endpoint and no consent screen an outside developer could integrate
      against. Recorded because it is institution-operated and machine-readable, not because it is
      consumable.
    properties:
      - type: Examples
        url: examples/skku-idp-saml-entity-descriptor-example.xml
      - type: Authentication
        url: authentication/skku-authentication.yml
      - type: Conformance
        url: conformance/skku-conformance.yml
      - type: Federation
        url: https://technical.edugain.org/api.php?action=show_entity&entityid=https%3A%2F%2Fkafe.skku.edu%2Fidp%2Fsimplesamlphp
      - type: Documentation
        url: https://www.kafe.or.kr/
  - aid: skku:pure-research-portal
    name: SKKU Research Portal (Elsevier Pure) — TENANT
    description: >-
      SKKU's research information system and public researcher/output profiles, running on Elsevier
      Pure at pure.skku.edu. This is a genuine institutional fact and one of the very few programmable
      research surfaces the university has, so the relationship is recorded — but it is recorded as a
      TENANCY, not as an SKKU API. The data is SKKU's; the contract, the API design and the Pure Web
      Service are Elsevier's, and no Pure specification is saved in this repository. The one publicly
      reachable machine surface here is a conformant OAI-PMH 2.0 provider at /ws/oai serving six
      metadata prefixes (oai_dc, qdc, mods, mods_swepub, xmetadiss, nl_didl) with the OpenAIRE CERIF
      1.2 profile declared in the response envelope; the Pure Web Service at /ws/api returns 401 and
      its documentation canonicalises to api.elsevierpure.com, so no programmable Pure interface is
      open even to the tenant.
    humanURL: https://pure.skku.edu/
    baseURL: https://pure.skku.edu/ws/oai
    tags: [ Research Information, Elsevier Pure, Tenant, OAI-PMH, Research Outputs, CRIS ]
    x-operator: tenant
    x-operator-evidence: >-
      pure.skku.edu is a CNAME to skku.elsevierpure.com -> apac.prod.elsevierpure.com. The OAI
      provider self-identifies as repositoryName "Pure OAI Repository" with adminEmail
      purehosted@elsevier.com, and /ws/api canonicalises to
      https://api.elsevierpure.com/ws/api/documentation/index.html.
    x-vendor: Elsevier Pure
