    x-operator-evidence: >-
      Institution-specific subdomain skku.dcollection.net on the shared dcollection.net platform; the
      page furniture and description metadata are the platform's ("디지털 학술정보 유통시스템"), not SKKU's.
    x-vendor: dCollection (KERIS)
    properties:
