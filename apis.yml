  - aid: skku:kingo-portal
    name: Kingo Portal (campus SSO and gated student systems)
    description: >-
      Kingo Portal is SKKU's single sign-on environment, the front door to the university's own online
      services — Google Workspace, GLS, iCampus (icampus.skku.edu, a Laravel learning system on SKKU's
      domain), course registration (sugang.skku.edu), electronic approval and notice boards — plus
      eduroam federated Wi-Fi roaming, which uses the same institutional identity that the KAFE/eduGAIN
