        url: https://skku.dcollection.net/
  - aid: skku:crossref-membership
    name: SKKU Crossref Membership (DOI registration)
    description: >-
      Two Sungkyunkwan University units are Crossref members in their own right and register DOIs
      under their own prefixes — member 9930, Sungkyunkwan University School of Medicine, prefix
      10.23838; and member 6576, Institute of Legal Studies, Sungkyunkwan University, prefix 10.17008.
      This is a membership SKKU holds, not a surface SKKU operates: the Crossref REST API is
      Crossref's contract and none of it is saved or credited here. The relationship is recorded
      because DOI registration is a real, evidenced, machine-resolvable fact about the institution.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/9930
