description: >-
  Sungkyunkwan University (SKKU) is a private research university in Seoul and Suwon, South Korea,
  founded in 1398 and operated since 1996 under the Samsung Foundation of Education. Like almost
  every university it is a federation of buyers rather than an API producer, and this profile is
  deliberate about which of that federation's surfaces are actually SKKU's engineering. SKKU
  operates no central developer portal and no API gateway — api.skku.edu, developer.skku.edu,
  data.skku.edu and status.skku.edu do not resolve — and publishes no OpenAPI for anything. What it
  does operate, and what almost no university catalog records, is a SAML 2.0 identity provider at
  kafe.skku.edu registered in eduGAIN through KAFE, the Korea Access Federation: entityID
  https://kafe.skku.edu/idp/simplesamlphp, scope skku.edu, supporting the REFEDS Research and
  Scholarship entity category and asserting the REFEDS Sirtfi assurance profile. That machine-readable
  metadata document is the strongest programmable surface SKKU runs. Its research information portal
  at pure.skku.edu looks institutional and is not: it CNAMEs to skku.elsevierpure.com and its OAI-PMH
  provider self-identifies as "Pure OAI Repository" with adminEmail purehosted@elsevier.com, so the
  live, conformant OAI-PMH 2.0 endpoint there is recorded as an Elsevier Pure TENANCY — SKKU's data
  on Elsevier's contract — and no Pure specification is saved in this repository. The thesis
  repository at skku.dcollection.net is likewise a KERIS dCollection tenancy whose robots.txt
  disallows all crawling and whose OAI paths return an HTML shell. Two SKKU units are Crossref
  members in their own right (School of Medicine, prefix 10.23838; Institute of Legal Studies, prefix
  10.17008) and the institution is registered in ROR as 04q78tk20; no DataCite provider or client
  exists. Everything else — Kingo Portal SSO, iCampus, course registration at sugang.skku.edu, the
  library discovery layer — is enrolment-gated with no public API, no developer registration and no
  published rate limits.
