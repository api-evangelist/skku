  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, which settles WHO OPERATES each
      surface before saving anything. The June 2026 review was right that SKKU publishes no public
      developer API; it missed two real surfaces and mis-shelved a third. FOUND: Sungkyunkwan
      University operates a SAML 2.0 identity provider — entityID
      https://kafe.skku.edu/idp/simplesamlphp, on its own registrable domain, registered in eduGAIN
      by KAFE (the Korea Access Federation) on 2022-09-26, scope skku.edu, supporting the REFEDS
      Research and Scholarship entity category and asserting the REFEDS Sirtfi assurance profile.
      Its metadata is public and machine-readable through the federation aggregate, and the
      advertised SSO endpoint answers live. That is the strongest programmable surface SKKU runs and
      it was entirely absent from the previous profile. ALSO FOUND: a conformant OAI-PMH 2.0 provider
      at pure.skku.edu/ws/oai serving six metadata prefixes with the OpenAIRE CERIF 1.2 profile —
      recorded as an Elsevier Pure TENANCY, not as SKKU engineering, because pure.skku.edu CNAMEs to
      skku.elsevierpure.com and the provider self-identifies as "Pure OAI Repository" with adminEmail
      purehosted@elsevier.com. Two SKKU units are Crossref members with their own DOI prefixes and the
      institution holds ROR 04q78tk20; no DataCite provider or client exists. CORRECTED: the previous
      profile carried github.com/GDG-SKKU as SKKU's GitHub organization — it is a Google Developer
      Group student chapter, not institutional engineering, and the pointer has been removed rather
      than re-credited; the LinkedIn pointer has been repaired to the canonical school page. Every
      consumable system remains enrolment-gated (Kingo Portal, iCampus, sugang.skku.edu, the library
      discovery layer), and no specification is saved in this repository for any surface, because SKKU
      operates no contract of its own and every contract that touches it belongs to a vendor.
    endpoints:
