    ("정보보호를 위해 부적절한 접근이 차단 되었습니다", HTTP 404). The metadata is published through the
    federation aggregate instead, which is the normal and correct distribution channel for it.
gated_surfaces:
- name: Kingo Portal (single sign-on)
  url: https://www.skku.edu/eng/CampusLife/ITServices/KingoPortal1_1.do
  x-operator: institution
  note: >-
    The campus SSO environment fronting Gmail/Google Workspace, GLS, iCampus, electronic approval and
