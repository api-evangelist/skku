  description: >-
    SKKU's institutional SAML 2.0 identity provider, running SimpleSAMLphp on SKKU's own
    kafe.skku.edu host. It supports the REFEDS Research and Scholarship entity category and asserts
    the REFEDS Sirtfi security incident response assurance profile. Signing and encryption use a
    self-issued X.509 certificate (CN=kafe.skku.edu, O=SKKU, OU=Information Service Affairs Team,
    valid 2022-09-23 to 2032-09-22).
  liveness:
  - url: https://kafe.skku.edu/simplesaml/saml2/idp/SSOService.php
    status: 400
    note: >-
      Probed 2026-09-01. SimpleSAMLphp answers "No SAML request provided — You accessed the Single
      Sign On Service interface, but did not provide a SAML Authentication Request", with a session
      tracking number. A 400 here is the correct response to a request carrying no SAMLRequest, so
      the advertised endpoint is confirmed live and functioning rather than dead.
  sources:
