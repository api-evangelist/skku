    published rate limits.
- name: Pure Web Service
  url: https://pure.skku.edu/ws/api
  x-operator: tenant
  note: >-
    https://pure.skku.edu/ws/api/524/ returns HTTP 401 "Request not authorized. Please provide a
    valid API key for access." The documentation page at /ws/api canonicalises to
    https://api.elsevierpure.com/ws/api/documentation/index.html — this is Elsevier's contract on
    SKKU's tenancy, and no key issuance path for third parties was found.
- name: iCampus
  url: https://icampus.skku.edu/
  x-operator: institution
  note: >-
    Learning system on SKKU's own domain, a Laravel application. /api/v1/courses returns 419
    "Page Expired" (CSRF), every other API path returns the app's Korean 404. No public API.
