generated: '2026-09-01'
method: probed
source: >-
  examples/skku-idp-saml-entity-descriptor-example.xml, retrieved 2026-09-01 from the eduGAIN
  metadata database; plus live probes of pure.skku.edu, icampus.skku.edu, sugang.skku.edu and
  kingo.skku.edu.
note: >-
  Sungkyunkwan University publishes no developer-facing authorization surface. There is no client
  registration path, no token endpoint, no consent screen and no API key issuance an outside
  developer could integrate against. What it does operate is an END-USER identity federation, and
  that is a different thing — it is recorded here because it is the strongest machine-readable
  surface the institution runs, not because it is consumable by a third-party integrator.
summary:
